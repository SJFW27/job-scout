name: scout
on:
  schedule:
    - cron: "17 10 * * 1-5"   # 5:17 a.m. Toronto in winter (6:17 in summer time); GitHub often starts cron runs late
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scout
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scout.py fetch
        env:
          TZ: America/Toronto
      - name: commit results
        run: |
          git config user.name "scout-bot"
          git config user.email "scout-bot@users.noreply.github.com"
          git add out state
          git diff --cached --quiet && exit 0
          git commit -m "fetch $(TZ=America/Toronto date +%F)"
          git pull --rebase && git push